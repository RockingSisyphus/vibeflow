[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeflow-repository-quality"
version = "0.1.0"
description = "Self-contained repository quality checks for VibeFlow"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vibeflow-repo-quality = "vibeflow_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

