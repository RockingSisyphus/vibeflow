name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tests/e2e/runtime/package-lock.json
      - name: Install test environment
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          dependencies = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["optional-dependencies"]["test"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY
      - name: Run full project verification (isolated pytest)
        env:
          TMPDIR: ${{ runner.temp }}
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer-cache
        shell: bash
        run: |
          set -o pipefail
          python tools/verify_project.py --full --workers 4 --scratch "${RUNNER_TEMP}/verification" 2>&1 | tee "${RUNNER_TEMP}/verification.log"
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/verification.log
            ${{ runner.temp }}/verification/*.json
            ${{ runner.temp }}/verification/acceptance.xml
          if-no-files-found: ignore

  workflow-host-windows:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install test environment
        shell: pwsh
        run: |
          python -c "import subprocess,sys,tomllib; dependencies=tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['test']; subprocess.check_call([sys.executable,'-m','pip','install',*dependencies])"
      - name: Verify Windows workflow hosts and named entries
        shell: pwsh
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python tools/run_tests.py --workers 4 --scratch "$env:RUNNER_TEMP/workflow-hosts" -- tests/e2e/test_cooperation_protocol.py tests/e2e/test_session_behaviors.py tests/e2e/test_cooperation_hosts.py tests/e2e/test_cooperation_http.py tests/e2e/test_cooperation.py tests/e2e/test_entries.py tests/e2e/test_encoding.py tests/e2e/test_sdk_configuration.py tests/e2e/test_javascript.py tests/e2e/test_resources.py tests/e2e/test_developer_tools.py::test_runner_preserves_selection_and_isolation --junitxml "$env:RUNNER_TEMP/workflow-hosts.xml" 2>&1 | Tee-Object "$env:RUNNER_TEMP/workflow-hosts.log"
          exit $LASTEXITCODE
      - name: Preserve workflow host results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-hosts-windows
          path: |
            ${{ runner.temp }}/workflow-hosts.log
            ${{ runner.temp }}/workflow-hosts.xml
          if-no-files-found: ignore
