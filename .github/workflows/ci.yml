name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            tools/mermaid-renderer/package-lock.json
            examples/js_aot_minimal/project/package-lock.json
            examples/typescript_sandbox/project/package-lock.json
      - name: Install Mermaid renderer
        working-directory: tools/mermaid-renderer
        run: npm ci
      - name: Install JS AOT example toolchain
        working-directory: examples/js_aot_minimal/project
        run: npm ci
      - name: Install TypeScript sandbox toolchain
        working-directory: examples/typescript_sandbox/project
        run: npm ci
      - name: Build and install wheel in isolation
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/vibeflow-wheel"
          wheel="$(find dist -maxdepth 1 -name 'vibeflow-*.whl' -print -quit)"
          test -n "$wheel"
          "$RUNNER_TEMP/vibeflow-wheel/bin/python" -m pip install "$wheel"
          "$RUNNER_TEMP/vibeflow-wheel/bin/python" -c \
            'from importlib.resources import files; assert files("vibeflow").joinpath("aot/resources/toolchain_driver.mjs").is_file()'
          "$RUNNER_TEMP/vibeflow-wheel/bin/vibeflow" --help
      - name: Install test environment
        run: python -m pip install -e . pytest
      - name: Compile Python files
        run: python -m compileall -q src tests examples
      - name: Run tests
        run: python -m pytest -q
      - name: Run integration sandbox
        run: PYTHONPATH=src python examples/integration_sandbox/run_all.py
      - name: Run JS AOT end-to-end
        run: >
          PYTHONPATH=src python examples/js_aot_minimal/run_e2e.py
          --puppeteer-root tools/mermaid-renderer
      - name: Run TypeScript integration sandbox
        run: >
          PYTHONPATH=src python examples/typescript_sandbox/run_all.py
          --puppeteer-root tools/mermaid-renderer
      - name: Run AOT through generated distribution launcher
        run: |
          python build_distribution.py --output "$RUNNER_TEMP/vibeflow-distribution"
          python "$RUNNER_TEMP/vibeflow-distribution/run.py" build \
            --workspace "$GITHUB_WORKSPACE/examples/js_aot_minimal/vibeflow_config.jsonc" \
            --config "$GITHUB_WORKSPACE/examples/js_aot_minimal/project/configs/greeting.jsonc" \
            --target node \
            --profile single-esm \
            --out-dir "$RUNNER_TEMP/vibeflow-distribution-aot"
          VF_ENTRY="$RUNNER_TEMP/vibeflow-distribution-aot/index.js" \
            node --input-type=module --eval '
              const { pathToFileURL } = await import("node:url");
              const workflow = await import(pathToFileURL(process.env.VF_ENTRY).href);
              const value = await workflow.runWorkflowAsync(
                { name: "  Release Smoke " },
                { capabilities: { "example.clock": { now: async () => 123 } } },
              );
              if (value.greeting !== "Hello, Release Smoke! (123)") {
                throw new Error(JSON.stringify(value));
              }
            '
      - name: Run quality check
        run: >
          PYTHONPATH=src python -m vibeflow quality-check --path src/vibeflow
          --warn-lines 450
          --max-lines 600
          --enable-structure-limits
          --warn-root-code-files 150
          --max-root-code-files 200
          --warn-code-dirs 16
          --max-code-dirs 24
          --warn-code-files-per-dir 20
          --max-code-files-per-dir 30
          --warn-code-dir-depth 4
          --max-code-dir-depth 5
          --warn-child-code-dirs-per-dir 6
          --max-child-code-dirs-per-dir 16
          --warn-root-level-code-files 110
          --max-root-level-code-files 120
