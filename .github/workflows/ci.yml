name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            tools/mermaid-renderer/package-lock.json
            sandbox/javascript/minimal/project/package-lock.json
            sandbox/javascript/integration/project/package-lock.json
      - name: Install test environment
        run: python -m pip install build pytest
      - name: Run full project verification
        run: python tools/verify_project.py --full
