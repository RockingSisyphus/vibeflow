name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            tools/mermaid-renderer/package-lock.json
            sandbox/javascript/minimal/project/package-lock.json
            sandbox/javascript/integration/project/package-lock.json
      - name: Install test environment
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          dependencies = tomllib.loads(Path("pyproject.toml").read_text())["project"]["optional-dependencies"]["test"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", "build", *dependencies])
          PY
      - name: Run full project verification (isolated pytest)
        env:
          TMPDIR: ${{ runner.temp }}
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer-cache
        shell: bash
        run: |
          set -o pipefail
          python tools/verify_project.py --full --workers 4 --scratch "${RUNNER_TEMP}/verification" 2>&1 | tee "${RUNNER_TEMP}/verification.log"
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/verification.log
            ${{ runner.temp }}/verification/*.json
          if-no-files-found: ignore
