[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeflow"
version = "0.17.0"
description = "Language-neutral workflow architecture, validation, and multi-target compilation"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-xdist>=3.8,<4"]

[project.scripts]
vibeflow = "vibeflow.tooling.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibeflow = [
    "targets/javascript/resources/*.mjs",
    "targets/javascript/resources/*.d.ts",
    "tooling/project/schema/*.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "strict_*.py", "vibeflow_strict.py"]
